# nginx site for Shop Dashboard (native Ubuntu deploy).
# Installed by deploy/setup_ubuntu.sh to /etc/nginx/sites-available/shopboard
# (SERVER_NAME is replaced by the setup script).
server {
    listen 80;
    server_name SERVER_NAME;
    client_max_body_size 50M;

    # WhiteNoise also serves static, but nginx is faster and offloads gunicorn
    location /static/ {
        alias /srv/shopboard/app/shopboard/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/shopboard/app/shopboard/media/;
    }

    location / {
        proxy_pass http://unix:/run/shopboard/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
