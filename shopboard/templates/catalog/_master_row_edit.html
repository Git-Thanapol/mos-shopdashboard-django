<tr id="master-row-{{ item.pk }}" class="row-editing">
    <td colspan="9">
        <form hx-post="{% url 'catalog:master_edit' item.pk %}"
              hx-target="#master-row-{{ item.pk }}" hx-swap="outerHTML"
              class="master-form-grid">
            {% for field in form %}
            <label class="form-cell">
                <span>{{ field.label }}</span>
                {{ field }}
                {% if field.errors %}<em class="field-error">{{ field.errors.0 }}</em>{% endif %}
            </label>
            {% endfor %}
            <div class="form-cell form-actions">
                <button class="btn btn-primary btn-sm" type="submit">บันทึก</button>
                <button class="btn btn-secondary btn-sm" type="button"
                        hx-get="{% url 'catalog:master_row' item.pk %}"
                        hx-target="#master-row-{{ item.pk }}" hx-swap="outerHTML">ยกเลิก</button>
            </div>
        </form>
    </td>
</tr>
